[build]
  # Compiles React + Vite
  command = "npm run build"
  
  # Directory containing the finished build
  publish = "dist"
  
  # Build-time environment variables.
  # Only VITE_GA_ID is read by the app (src/app/components/analytics.tsx).
  # It is set in the Netlify UI, not here, so the value stays out of git.
  # NOTE: anything prefixed VITE_ is inlined into the PUBLIC bundle by Vite —
  # never put a secret key here or in the Netlify env under a VITE_ name.
  # [build.environment]
  #   NODE_VERSION = "18"

# SPA redirect rules. Without these, deep links and hash routes 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Long cache for fingerprinted assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must always revalidate, otherwise a deploy is invisible to returning visitors
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
