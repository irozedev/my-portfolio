[build]
  # Build command - компілює React + Vite
  command = "npm run build"
  
  # Publish directory - папка з готовим білдом
  publish = "dist"
  
  # Environment variables (якщо потрібні)
  # [build.environment]
  #   NODE_VERSION = "18"

# SPA redirect rules - без цього роутинг не працює!
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Headers для безпеки та performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache для статичних ресурсів
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Окремий кеш для HTML
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
