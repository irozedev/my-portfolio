# pnpm 11 no longer reads the "pnpm" field from package.json — overrides and
# build-script approvals live here instead.

overrides:
  # Transitive peers (lucide-react, sonner, @radix-ui/*) each pull their own
  # @types/react. Two copies of the React types in one tree make every
  # component "not a valid JSX element type", because ReactNode then resolves
  # to two different identities. Pin a single copy for the whole tree.
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3

allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
