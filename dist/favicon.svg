<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff"/>
      <stop offset="100%" style="stop-color:#00b8dd"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Outer glow ring -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="url(#glow)" stroke-width="1.5" opacity="0.5"/>
  <!-- Robot head outline -->
  <rect x="14" y="12" width="36" height="28" rx="6" fill="none" stroke="#00d9ff" stroke-width="2" filter="url(#neon)"/>
  <!-- Antenna -->
  <line x1="32" y1="12" x2="32" y2="6" stroke="#00d9ff" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="5" r="2.5" fill="#00d9ff" opacity="0.9">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <!-- Eyes -->
  <circle cx="24" cy="26" r="4" fill="#00d9ff" opacity="0.9">
    <animate attributeName="r" values="3.5;4.5;3.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="40" cy="26" r="4" fill="#9333ea" opacity="0.9">
    <animate attributeName="r" values="3.5;4.5;3.5" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <!-- Eye pupils -->
  <circle cx="24" cy="26" r="1.5" fill="#0a0a0a"/>
  <circle cx="40" cy="26" r="1.5" fill="#0a0a0a"/>
  <!-- Mouth / smile -->
  <path d="M24 33 Q32 38 40 33" fill="none" stroke="#00d9ff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <!-- "R" letter on chest -->
  <text x="32" y="53" text-anchor="middle" font-family="monospace" font-weight="900" font-size="14" fill="#00d9ff" filter="url(#neon)">R</text>
  <!-- Side antenna lines -->
  <line x1="14" y1="22" x2="9" y2="18" stroke="#00d9ff" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <line x1="50" y1="22" x2="55" y2="18" stroke="#9333ea" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  <!-- Scan line animation -->
  <rect x="14" y="12" width="36" height="2" fill="#00d9ff" opacity="0.15" rx="1">
    <animate attributeName="y" values="12;38;12" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
