    <!--
      A LocalBusiness block used to sit here, and it had to go.

      It declared a business at a postal address in Antwerpen, with opening
      hours (06:00-12:00), a phone number and a price range, plus a catalogue
      of nine priced Offers. Three things were wrong with that:

        1. There is no registered business. A bijberoep was considered and
           never registered, so this asserted as machine-readable fact what
           the copy is careful never to claim.
        2. The address was Antwerpen. Antwerp is where Stepan wants to work,
           not where he lives - a fair thing to signal with geo meta, but a
           PostalAddress on a business entity is a claim of establishment.
           The Person block now says Lommel, Limburg, which is true and
           matches the CV.
        3. The site is aimed at getting hired. Telling Google this domain is
           a local service business invites exactly the wrong result card.

      ProfessionalService above still covers the freelance side. Its
      priceRange was mojibake and its opening hours were invented, so both
      are gone from it too.
    -->

    <!--
      Section list for the one page this site is.

      This used to be a BreadcrumbList, and it is what Google rendered as
      "roze.live > Projecten > Over Mij > Contact" under the search result:
      Dutch labels hardcoded onto a page served in English, because the block
      never varied by language.

      It was also the wrong type. A BreadcrumbList describes a *path* through a
      hierarchy, and every "item" here was a fragment URL. Google strips
      everything after "#", so all four entries collapsed to
      https://roze.live/ - four names for one page, not a trail.

      ItemList is what this actually is: the sections of a single page, in the
      order the default (CV) view renders them. The anchors are real ids in
      main-page.tsx. Note #services and #how-i-work are deliberately absent -
      they only exist in client mode, and the default view is the CV.

      Real sitelinks cannot be produced from here in any case. They need
      separate crawlable URLs, which a hash-routed single page does not have.
    -->
    <script type="application/ld+json">

          root.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
