    <script>
      // Apply the saved theme before first paint so light-theme users don't get
      // a flash of the dark palette. Must stay in sync with theme-context.tsx.
      (function() {
        try {
          var t = localStorage.getItem('theme') === 'light' ? 'light' : 'dark';
          var root = document.documentElement;
          root.setAttribute('data-theme', t);
          root.classList.add(t);
          root.style.colorScheme = t;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#0a0a0a');
        } catch (e) {}
      })();
    </script>
