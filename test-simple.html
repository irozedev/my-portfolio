<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roze.live - Simple Test</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      color: #00d9ff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    
    .container {
      max-width: 800px;
      text-align: center;
      animation: fadeIn 1s ease-in;
    }
    
    h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #00d9ff 0%, #00ff88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    p {
      font-size: 1.5rem;
      color: #a0a0a0;
      margin-bottom: 2rem;
    }
    
    .status {
      background: rgba(0, 217, 255, 0.1);
      border: 2px solid #00d9ff;
      border-radius: 1rem;
      padding: 2rem;
      margin-top: 2rem;
    }
    
    .success {
      color: #00ff88;
      font-size: 1.2rem;
      margin: 1rem 0;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .code {
      background: rgba(0, 0, 0, 0.5);
      padding: 1rem;
      border-radius: 0.5rem;
      margin-top: 1rem;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
      color: #00d9ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Roze.live</h1>
    <p>Stepan Roze | Software Developer</p>
    
    <div class="status">
      <div class="success">✅ HTML працює!</div>
      <div class="success">✅ CSS працює!</div>
      <div class="success" id="js-status">⏳ JavaScript...</div>
      
      <div class="code" id="info">
        Loading diagnostic info...
      </div>
    </div>
  </div>
  
  <script>
    // Test JavaScript
    document.getElementById('js-status').textContent = '✅ JavaScript працює!';
    
    // Show diagnostic info
    const info = `
📍 URL: ${window.location.href}
🌐 Host: ${window.location.host}
🔧 User Agent: ${navigator.userAgent.substring(0, 50)}...
⏰ Time: ${new Date().toLocaleString()}
    `.trim();
    
    document.getElementById('info').textContent = info;
    
    console.log('🔥 TEST PAGE LOADED SUCCESSFULLY!');
    console.log('Location:', window.location.href);
  </script>
</body>
</html>
