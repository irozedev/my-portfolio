<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; overflow:hidden; }
  .card {
    position:relative; width:1200px; height:630px;
    background:
      radial-gradient(1100px 620px at 78% 30%, rgba(0,180,200,0.16), transparent 62%),
      radial-gradient(900px 700px at 12% 96%, rgba(90,40,140,0.30), transparent 60%),
      linear-gradient(150deg, #060a10 0%, #08111a 45%, #0a0a14 100%);
    font-family:'Inter', system-ui, sans-serif; color:#fff; overflow:hidden;
  }
  .frame { position:absolute; inset:14px; border:1px solid rgba(255,255,255,0.07); border-radius:6px; }
  .rings { position:absolute; right:120px; top:315px; transform:translate(50%,-50%); }
  .ring { position:absolute; border:1px solid rgba(0,217,255,0.20); border-radius:50%; transform:translate(-50%,-50%); }
  .r1 { width:340px; height:340px; }
  .r2 { width:250px; height:250px; border-color:rgba(0,217,255,0.28); }
  .r3 { width:172px; height:172px; border-color:rgba(0,217,255,0.42); }
  .glyph {
    position:absolute; transform:translate(-50%,-50%);
    font-family:'JetBrains Mono', monospace; font-size:52px; font-weight:500;
    color:#22d3ee; letter-spacing:-1px;
  }
  .body { position:absolute; left:80px; top:96px; }
  .domain {
    font-family:'JetBrains Mono', monospace; font-size:25px; font-weight:400;
    color:#22d3ee; letter-spacing:7px; margin-bottom:44px;
  }
  h1 {
    font-size:86px; font-weight:800; letter-spacing:1.5px; line-height:1;
    background:linear-gradient(96deg,#ffffff 0%,#ffffff 34%,#3fdcf5 72%,#22d3ee 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:22px;
  }
  h2 { font-size:38px; font-weight:700; letter-spacing:-0.4px; margin-bottom:20px; }
  .stack {
    font-family:'JetBrains Mono', monospace; font-size:25px; font-weight:400;
    color:rgba(255,255,255,0.42); letter-spacing:1.5px;
  }
  .badges { position:absolute; left:80px; bottom:96px; display:flex; gap:22px; }
  .badge {
    padding:17px 27px; border-radius:13px; font-size:22px; font-weight:700;
    border:1px solid rgba(255,255,255,0.11); background:rgba(255,255,255,0.035);
    color:rgba(255,255,255,0.93); white-space:nowrap;
  }
  .badge.accent { border-color:rgba(0,217,255,0.55); color:#22d3ee; background:rgba(0,217,255,0.07); }
</style>
</head>
<body>
  <div class="card">
    <div class="frame"></div>
    <div class="rings">
      <div class="ring r1"></div>
      <div class="ring r2"></div>
      <div class="ring r3"></div>
      <div class="glyph">&lt;/&gt;</div>
    </div>
    <div class="body">
      <div class="domain">roze.live</div>
      <h1>STEPAN ROZE</h1>
      <h2>Front-End / JavaScript Developer</h2>
      <div class="stack">React &middot; Vue &middot; Next.js &middot; TypeScript</div>
    </div>
    <div class="badges">
      <div class="badge accent">8+ years</div>
      <div class="badge">E-commerce &amp; Enterprise</div>
      <div class="badge">Belgium &middot; Open to roles</div>
    </div>
  </div>
</body>
</html>
